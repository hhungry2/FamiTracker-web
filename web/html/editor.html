<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FamiTracker-web editor</title>
<link rel="stylesheet" href="dnft-editor.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #101218; }
  #editor { height: 100vh; }
</style>
</head>
<body>
<div id="editor"></div>
<script type="module">
import { DnFTEditor } from './dnft-editor.mjs';
import { resolveLanguage } from './dnft-editor-strings.mjs';

// All ten site languages, e.g. ?lang=de or ?lang=zh-Hant; browser preferences otherwise.
const lang = resolveLanguage(new URLSearchParams(location.search).get('lang') ?? navigator.languages ?? navigator.language);
document.documentElement.lang = lang;
// demo/index.json lists the modules `make site` puts next to the page
window.editor = await DnFTEditor.create(document.getElementById('editor'), { base: '.', lang, demos: 'demo/index.json' });
</script>
</body>
</html>
